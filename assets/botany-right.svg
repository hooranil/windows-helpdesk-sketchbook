      <ellipse cx="176" cy="256" rx="4" ry="4"/>
      <ellipse cx="196" cy="268" rx="4" ry="4"/>
    </g>
    <g opacity=".34" fill="#6f7f86">
      <path d="M104 398 C102 366 108 340 120 320 C120 344 114 372 112 398 Z"/>
      <ellipse cx="120" cy="312" rx="6" ry="9"/>
      <ellipse cx="108" cy="330" rx="5" ry="7"/>
