      <ellipse cx="134" cy="316" rx="10" ry="9"/>
      <ellipse cx="108" cy="322" rx="9" ry="8"/>
      <ellipse cx="196" cy="352" rx="11" ry="10"/>
      <ellipse cx="210" cy="368" rx="8" ry="8"/>
    </g>
    <g opacity=".4" fill="#c9a86a">
      <ellipse cx="128" cy="308" rx="5" ry="5"/>
      <ellipse cx="203" cy="360" rx="4" ry="4"/>
      <ellipse cx="60" cy="286" rx="6" ry="5"/>
    </g>
  </g>

  <!-- seed heads -->
  <g filter="url(#wl2)" opacity=".42" fill="#6f7f86" style="mix-blend-mode:multiply">
    <path d="M222 414 C220 380 224 350 234 326 C236 348 234 380 232 414 Z"/>
    <ellipse cx="234" cy="318" rx="7" ry="10"/>
